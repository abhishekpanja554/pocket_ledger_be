app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
spring:
  application:
    name: pocket_ledget_be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pocket_ledger}
    username: ${DB_USER:abhis}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  session:
    jdbc:
      initialize-schema: always